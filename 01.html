<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>

<body>

    <!-- College Logo -->
    <center>
        <img src="D:\Programming\HTML\Logo.png" alt="College Logo" width="100" height="100">
    </center>

    <h1 align="center">
        <u>Student Registration Form</u>
    </h1>

    <p align="center">
        <b>Welcome!</b><br>
        <i>Please fill in the registration form below.</i>
    </p>

    <form>
        <table border="1" cellpadding="8" align="center">

            <tr>
                <td><b>Student Name</b></td>
                <td>
                    <input type="text" name="name">
                </td>
            </tr>

            <tr>
                <td><b>Enrollment No.</b></td>
                <td>
                    <input type="text" name="enroll">
                </td>
            </tr>

            <tr>
                <td><b>Course</b></td>
                <td>
                    <select name="course">
                        <option>B.Tech CSE</option>
                        <option>B.Tech CE</option>
                    </select>
                </td>
            </tr>

        </table>
    </form>

</body>

</html>
